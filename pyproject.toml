[project]
name = "nethack-raph"
version = "0.1.0"
requires-python = "==3.8.*"
dependencies = [
    "torch",
    "einops",
    "hydra-core==1.0.6",
    "hydra-colorlog",
    "aicrowd-api",
    "aicrowd-gym",
    "numpy",
    "scipy",
    "nle>=0.7.2",
    "tqdm",
    "wandb",
    "minihack",
    #"nle-toolbox",
]

[tool.uv.sources]
#nle-toolbox = { git = "https://github.com/ivannz/nle_toolbox.git" }

[project.optional-dependencies]
dev = [
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nethack_raph", "agents", "envs", "nethack_baselines"]
